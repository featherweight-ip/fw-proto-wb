
# yaml-language-server: $schema=https://fvutils.github.io/ivpm/ivpm.schema.json
package:
  name: fw-proto-wb
  default-dep-set: dev

  dep-sets:
  # The fw-hdl standard-platform layer, as a dep-set a consumer can opt into.
  # Pairs with the `use-fw-hdl` dv-flow config in flow.yaml: this makes the
  # package present, the config makes it visible to the build. A consumer that
  # wants fw_proto_wb_spl_pkg needs BOTH; one without the other is a no-op or a
  # load error respectively.
  - name: use
    deps:
    - name: fw-hdl
      url: https://github.com/featherweight-hdl/fw-hdl.git
      dep-set: default-dev

  # Not `uses: use`: the kit builds without fw-hdl, and fw-hdl's own deps
  # are not all published on GitHub, so pulling it in here breaks every
  # fetch of this package (including fwvip-wb's) on a public runner.
  - name: default-dev
    deps:
    - name: fw-proto-core
      url: https://github.com/featherweight-ip/fw-proto-core.git
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
    - name: dv-flow-libformal
      url: https://github.com/dv-flow/dv-flow-libformal.git
    - name: verilator
      src: gh-rls
      url: https://github.com/edapack/verilator-bin
      cache: true
    - name: yosys
      src: gh-rls
      url: https://github.com/edapack/yosys-bin
      cache: true
      dep-set: default
    # Documentation build (Sphinx) — used by the docs CI workflow. 'sphinx'
    # itself is pulled in transitively via dv-flow-mgr; these are the extras the
    # fw-proto-wb docs need.
    - name: myst-parser
      src: pypi
    - name: furo
      src: pypi
    - name: sphinx-copybutton
      src: pypi
    # SymbiYosys (sby, from the yosys package) is a Python program that imports
    # 'click' at startup; it isn't bundled with the yosys binaries, so the
    # formal proof (fw.proto.wb.fv) needs it pulled into the env explicitly.
    - name: click
      src: pypi

  # What a developer of THIS repo fetches (the default): the tools above,
  # plus the Wishbone VIP that the kit's own tests are written with. flow.dv
  # imports org.fwvip.wb; the VIP imports fw.proto.wb, which resolves to this
  # checkout -- see the comment in flow.dv.
  #
  # Kept out of default-dev on purpose. fwvip-wb fetches this package with
  # `dep-set: default-dev`, so adding the VIP there would make the VIP fetch
  # itself. `deps: skip` stops either side walking back into the other: the
  # VIP's own developer environment is not needed to build the VIP.
  - name: dev
    uses: default-dev
    deps:
    - { name: fwvip-wb, url: https://github.com/featherweight-vip/fwvip-wb.git, deps: skip }
    - { name: fwvip-core, url: https://github.com/featherweight-vip/fwvip-core.git, deps: skip }
