name: Docs

# Build the Sphinx documentation on every push/PR.
#
# THE PAGES DEPLOY WAS DELETED 2026-08-30 (github-coexistence-completion-plan.md
# Phase 5, wave 1, runbook step 4). dvkit.org owns all documentation and these
# docs now publish to dvkit.org/featherweight-ip/fw-proto-wb/ from
# .forgejo/workflows/docs.yml.
#
# The build stayed. It is a genuine CI check -- `sphinx-build -W` turns warnings
# into errors, so it catches a broken cross-reference on the commit that
# introduced it -- and losing that was never the point. Only the PUBLICATION
# left.
#
# Deleting rather than tag-gating is deliberate, and it is the runbook's own
# instruction: a tag-gated Pages deploy is still a second publisher of the same
# content on a different schedule, and two publishers of one document set is the
# problem regardless of how rarely the second one fires.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build HTML
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Sanity-check the build
        # Sphinx exits 0 on a build that produced almost nothing, and this is
        # now the only place the GitHub side looks at the result -- there is no
        # deploy step downstream to notice an empty tree.
        run: |
          test -s docs/_build/html/index.html \
            || { echo "::error::no index.html in the build output"; exit 1; }
          echo "generated pages: $(find docs/_build/html -name '*.html' | wc -l)"
