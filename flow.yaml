# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#****************************************************************************
#* flow.yaml -- fw.proto.wb as CONSUMERS see it: the kit sources only.
#*
#* This is the file ivpm's package map points at, so it is what a project
#* that imports `fw.proto.wb` loads. The tests are not here: they live in
#* flow.dv, the developer project, which dfm prefers when it searches for
#* the root package. A consumer never loads them, so never needs the tools
#* they use.
#****************************************************************************
package:
  name: fw.proto.wb

  # The kit proper has NO imports: fw_proto_wb_pkg, the transactors and the
  # checker build against nothing but themselves. This is what lets the
  # package be fetched (and built) without fw-hdl present at all -- see the
  # `use-fw-hdl` IVPM dep-set.
  fragments:
  - src/flow.yaml

  configs:
  # fw-hdl standard-platform layer. Selected with `dfm ... -c use-fw-hdl`, which
  # requires the package to have been fetched with the matching IVPM dep-set so
  # that fw-hdl is in the package map. Both halves are here on purpose: the
  # import (availability) and the fragment that wires it in. With the config
  # inactive neither is looked at, so a no-fw-hdl checkout loads clean.
  - name: use-fw-hdl
    imports:
    - fw-hdl
    fragments:
    - src/spl.yaml
